
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Гули ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
            color: #5d4037;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Нежный размытый световой блик на фоне */
        .glow-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.4);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
            animation: pulseGlow 6s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 520px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(194, 97, 126, 0.15);
        }

        .letter-g {
            font-family: 'Marcellus', serif;
            font-size: 85px;
            color: #d81b60;
            line-height: 1;
            margin-bottom: 5px;
            text-shadow: 0 4px 15px rgba(216, 27, 96, 0.2);
            animation: floatG 4s infinite ease-in-out;
        }

        @keyframes floatG {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8e24aa;
            margin-bottom: 25px;
            font-weight: 500;
            opacity: 0.8;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(244, 143, 177, 0.3);
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 30px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.8);
        }

        p#message {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #4a148c;
            font-weight: 400;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: linear-gradient(135deg, #f06292 0%, #e91e63 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 0.95rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.25);
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff80ab 0%, #ff4081 100%);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(233, 30, 99, 0.35);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Цветы и анимация полета */
        .flower-particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 3s forwards ease-out;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.3) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% {
                transform: translateY(-250px) scale(1.4) rotate(45deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="container">
        <div class="letter-g">G</div>
        <div class="subtitle">For My Dearest Guly</div>

        <div class="card">
            <p id="message">Нажми на кнопку ниже, чтобы открыть теплое послание...</p>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="nextMessage()">Открыть фразы ✨</button>
            <button class="btn btn-secondary" onclick="spawnFlowers(event)">Подарить цветы 💐</button>
        </div>
    </div>

    <script>
        const messages = [
            "Каждый день с тобой наполнен особым смыслом и теплом. 💫",
            "Твоя улыбка способна осветить даже самый пасмурный день. 🌸",
            "Ты — самое прекрасное и нежное, что есть в моей жизни. ❤️",
            "Спасибо за твою доброту и искренность, моя родная Гуля. 🥰"
        ];

        let currentIndex = -1;

        function nextMessage() {
            currentIndex = (currentIndex + 1) % messages.length;
            const msgElement = document.getElementById("message");

            msgElement.style.opacity = '0';
            msgElement.style.transform = 'translateY(5px)';

            setTimeout(() => {
                msgElement.textContent = messages[currentIndex];
                msgElement.style.opacity = '1';
                msgElement.style.transform = 'translateY(0)';
            }, 300);
        }

        // Полевые пионы, лилии и немного подсолнухов
        const flowerIcons = [
            '🌸', '🌺', '🌸', // Пионы / Нежные цветы
            '🪷', '💮',       // Лилии
            '🌻'             // Подсолнухи
        ];

        function spawnFlowers(event) {
            const btn = event.currentTarget;
            const rect = btn.getBoundingClientRect();

            // Создаем серию вылетающих цветов
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const flower = document.createElement('div');
                    flower.classList.add('flower-particle');

                    // Выбираем случайный цветок из списка
                    const randomFlower = flowerIcons[Math.floor(Math.random() * flowerIcons.length)];
                    flower.innerHTML = randomFlower;

                    // Размер цветка
                    const size = Math.floor(Math.random() * 20) + 25;
                    flower.style.fontSize = `${size}px`;

                    // Начальные координаты возле кнопки
                    const randomX = rect.left + (rect.width / 2) + (Math.random() * 120 - 60);
                    const randomY = rect.top + (Math.random() * 20 - 10);

                    flower.style.left = `${randomX}px`;
                    flower.style.top = `${randomY}px`;

                    document.body.appendChild(flower);

                    setTimeout(() => {
                        flower.remove();
                    }, 3000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
